name: mypy

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded in-progress runs for the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          micromamba-version: "1.5.10-0" # until https://github.com/mamba-org/setup-micromamba/issues/225 is resolved
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true
          post-cleanup: "all"
      - name: Install pytensor and mypy dependencies
        run: |
          pip install -e .
          python --version
        shell: micromamba-shell {0}
      - name: Run mypy
        run: |
          python ./scripts/run_mypy.py --verbose
        shell: micromamba-shell {0}
