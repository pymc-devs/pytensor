name: Benchmark revision comparison

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository containing both revisions
        default: pymc-devs/pytensor
      base_ref:
        description: Base revision or ref
        default: main
      head_ref:
        description: Candidate revision or ref (for example refs/pull/2647/head)
        required: true
      case_file:
        description: Case file from this workflow's checkout
        default: scripts/benchmarks/special.py

permissions:
  contents: read

env:
  BENCH_REPOSITORY: ${{ inputs.repository }}
  BENCH_BASE: ${{ inputs.base_ref }}
  BENCH_HEAD: ${{ inputs.head_ref }}
  BENCH_CASE: ${{ inputs.case_file }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - id: refs
        shell: bash
        run: >-
          python scripts/benchmarks/compare.py --resolve-only
          --repository "$BENCH_REPOSITORY" --base "$BENCH_BASE" --head "$BENCH_HEAD"

  compare:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install the same wheels on every platform
        run: >-
          python -m pip install --only-binary=:all:
          -r scripts/benchmarks/requirements.txt
      - name: Compare revisions
        shell: bash
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base }}
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
        run: >-
          python scripts/benchmarks/compare.py
          --repository "$BENCH_REPOSITORY" --base "$BASE_SHA" --head "$HEAD_SHA"
          --case-file "$BENCH_CASE" --output benchmark-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmark-results/
