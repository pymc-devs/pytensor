[package]
name = "pytensor-llvm"
version = "0.1.0"
edition = "2024"

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon"] }
hex = "0.4.3"
# only the native target is initialized; the default `target-all` would need every
# LLVM backend, which the minimal LLVM build (llvm-minimal.cmake) doesn't have
inkwell = { version = "0.11.0", default-features = false, features = ["llvm23-1"] }
libm = "0.2.16"
llvm-sys = { version = "231", features = ["prefer-static"] }
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
rand_core = "0.10.1"
rand_distr = "0.6.0"
rand_xoshiro = "0.8.1"
rayon = "1.12.0"
sha2 = "0.11.1"
zerocopy = { version = "0.8.63", features = ["derive"] }

# perf map and jitdump (src/perf/linux.rs)
[target.'cfg(target_os = "linux")'.dependencies]
addr2line = { version = "0.27.1", default-features = false }
gimli = { version = "0.34.0", default-features = false, features = ["read"] }
libc = "0.2.191"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }

[lib]
name = "pytensor_llvm"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
