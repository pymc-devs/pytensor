[package]
name = "pytensor-llvm"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
inkwell = { version = "0.11.0", features = ["llvm18-1-prefer-dynamic"] }
libm = "0.2.16"
llvm-sys = { version = "181", features = ["prefer-dynamic"] }
matrixmultiply = "0.3.11"
numpy = "0.30.0"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[lib]
name = "pytensor_llvm"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
